<div id="content-container">
	@if (!showSummary) {
		<app-draw-animation class="content" [resultEntry]="result.results[currentEntry]" [circleColor]="color" (finished)="onAnimationFinished()">
		</app-draw-animation>
	} @else {
		<app-draw-summary class="content" [result]="result.results"></app-draw-summary>
	}

	<div id="skip-button-container">
		<button id="skip-button" mat-button (click)="skip()">Skip</button>
	</div>
</div>
