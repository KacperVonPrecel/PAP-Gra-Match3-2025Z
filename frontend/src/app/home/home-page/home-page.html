<div id="main">
	<div id="content">
		<button id="play-button" matButton="filled" routerLink="/main/match3" i18n>Play</button>
		<button id="change-team" matButton="filled" (click)="changeTeam()" i18n>Change team</button>
		@if (activeTeam()) {
			<div id="selected-team">
				@for (item of activeTeam(); track $index) {
					<app-character-in-team [character]="item"></app-character-in-team>
				}
			</div>
		}
	</div>
</div>
