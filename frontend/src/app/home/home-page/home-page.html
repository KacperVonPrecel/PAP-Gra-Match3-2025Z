<div id="main">
    <div id="utility-bar">
        <button id="settings" mat-mini-fab (click)="openSettings()">
            <mat-icon>settings</mat-icon>
        </button>
        <div id="utility-buttons-wrapper">
            <button id="rank" mat-button i18n>{{rank}} rank</button>
            <span class="label" i18n>{{money}} money</span>
         </div>
    </div>
    <div id="content">
        <button id="play-button" matButton="filled" color="primary"  i18n>Play</button>
    </div>
</div>
