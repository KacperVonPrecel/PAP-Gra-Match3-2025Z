<h2 mat-dialog-title id="user-ranking">Rank {{rank}}</h2>
<mat-dialog-content>
    <mat-list>
        @for (user of ranking; track user.place){
            <div class="ranking-container">
                <span class="ranking-place">{{user.place}}</span>
                <span class="ranking-name">{{user.name}}</span>
                <span class="ranking-rank">{{user.rank}}</span>
            </div>
        }
    </mat-list>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button id="close-button" mat-dialog-close i18n>Close</button>
</mat-dialog-actions>
