<div id="main-container">
	<div id="show-results">
		@if (data.victory) {
			<h2 style="color: blue" i18n>Victory</h2>
		} @else {
			<h2 style="color: red" i18n>Defeat</h2>
		}

		<div>Money gain: {{ data.moneyEarned }}</div>

		@if (data.eloChange >= 0) {
			<div style="color: blue">Elo gain: {{ data.eloChange }}</div>
		} @else {
			<div style="color: red">Elo loss: {{ -data.eloChange }}</div>
		}
		<button matButton="filled" (click)="leave()">Ok</button>
	</div>
</div>
